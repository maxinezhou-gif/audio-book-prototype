<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagelark — Prototypes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pagelark">
<meta name="theme-color" content="#f2ede5">
<link rel="apple-touch-icon" href="assets/app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="prefs.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    background: var(--surface-container);
    font-family: var(--md-ref-typeface-plain), system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .index { width: 100%; max-width: 440px; }

  .index__list { display: flex; flex-direction: column; gap: var(--app-space-16); }

  .index__item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding-inline: var(--app-space-24);
    background: var(--surface);
    border: 1px solid var(--outline-variant);
    border-radius: var(--md-sys-shape-corner-full);
    color: var(--on-surface);
    font: 600 17px/24px var(--md-ref-typeface-plain), system-ui, sans-serif;
    letter-spacing: .1px;
    text-align: center;
    text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .index__item:hover {
    background: var(--surface-container-high);
    border-color: var(--outline);
  }
  .index__item:active { transform: scale(.99); }

  /* One entry needs a word of orientation: the button that starts the
     animation sits below the fold of the device's own scroll, so a visitor
     can land there and see nothing happen. Same muted 13px as the Viewing
     notes below, so it reads as guidance rather than as part of the label. */
  .index__item--noted {
    flex-direction: column;
    gap: 2px;
    height: auto;
    min-height: 56px;
    padding-block: var(--app-space-12);
  }
  .index__item-note {
    color: var(--outline);
    font: 400 13px/18px var(--md-ref-typeface-plain), system-ui, sans-serif;
    letter-spacing: 0;
  }

  .index__label {
    margin: var(--app-space-40) 0 var(--app-space-16);
    padding-inline: var(--app-space-24);
    color: var(--outline);
    font: 400 15px/20px var(--md-ref-typeface-plain), system-ui, sans-serif;
  }

  /* Divider · Type=Full width — 1px outline-variant.
     Separates the prototypes from the handoff material below, which is a
     different kind of thing rather than just another entry in the list. */
  .index__divider {
    height: 1px;
    margin: var(--app-space-40) 0 0;
    border: 0;
    background: var(--outline-variant);
  }
  /* the label already carries a 40 top margin; after a rule that is too much */
  .index__divider + .index__label { margin-top: var(--app-space-24); }

  @media (prefers-reduced-motion: reduce) {
    .index__item { transition: none; }
    .index__item:active { transform: none; }
  }

  /* viewing options */
  .index__setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--app-space-16);
    padding-inline: var(--app-space-24);
  }
  .index__setting-text { color: var(--on-surface); font: 400 15px/20px var(--md-ref-typeface-plain), system-ui, sans-serif; }
  .index__setting-note { margin-top: 2px; color: var(--outline); font: 400 13px/18px var(--md-ref-typeface-plain), system-ui, sans-serif; }

  /* Only worth saying on a phone, and pointless once they have done it */
  .index__tip { display: none; }
  @media (max-width: 440px) {
    body { padding: 32px 20px; }
    .index__tip {
      display: block;
      margin: var(--app-space-40) 0 0;
      padding-inline: var(--app-space-24);
      color: var(--outline);
      font: 400 13px/18px var(--md-ref-typeface-plain), system-ui, sans-serif;
      text-align: center;
    }
  }
  @media (display-mode: standalone) {
    .index__tip { display: none; }
  }
</style>
</head>
<body>

<main class="index">

  <div class="index__list">
    <a class="index__item" href="record-book.html">Record a book</a>
    <a class="index__item" href="record-book-flat.html">Record a book — no dial halo</a>
    <a class="index__item index__item--noted" href="success-animation.html">
      <span>Success animation</span>
      <span class="index__item-note">Scroll to the bottom of the list and tap “Complete the book”</span>
    </a>
  </div>

  <p class="index__label">Viewing</p>

  <div class="index__setting">
    <span>
      <span class="index__setting-text">iOS status bar</span>
      <span class="index__setting-note" id="statusBarNote"></span>
    </span>
    <button class="md-switch" id="statusBarToggle" role="switch" aria-checked="true"
            aria-label="Draw the iOS status bar inside the prototype">
      <img class="md-switch__handle" src="assets/switch-handle.svg" alt="" width="24" height="24">
    </button>
  </div>

  <p class="index__tip">Share → Add to Home Screen to run these without the browser bar.</p>

</main>

<script>
  (function () {
    var toggle = document.getElementById('statusBarToggle');
    var note = document.getElementById('statusBarNote');

    function sync() {
      var on = Prefs.statusBar();
      toggle.setAttribute('aria-checked', String(on));
      note.textContent = on ? 'Drawn inside the frame' : 'Using your device’s own';
    }

    toggle.addEventListener('click', function () {
      Prefs.setStatusBar(!Prefs.statusBar());
      sync();
    });

    sync();
  })();
</script>

</body>
</html>
